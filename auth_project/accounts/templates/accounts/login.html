<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        /* THEME VARIABLES */
        :root {
            --bg: #f3f4f6;
            --navbar-bg: #1f2937;
            --card-bg: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #4b5563;
            --button-bg: #2563eb;
            --button-hover: #1d4ed8;
            --link: #2563eb;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --navbar-bg: #020617;
            --card-bg: #020617;
            --text-primary: #e5e7eb;
            --text-secondary: #94a3b8;
            --button-bg: #3b82f6;
            --button-hover: #2563eb;
            --link: #60a5fa;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Navbar */
        .navbar {
            background: var(--navbar-bg);
            padding: 14px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar .logo {
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-toggle {
            background: transparent;
            border: 1px solid #64748b;
            color: #e5e7eb;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .navbar a {
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            background: #176fd5;
            border-radius: 6px;
            font-size: 14px;
            transition: background 0.3s ease;
        }

        .navbar a:hover {
            background: #0f5ec4;
        }

        /* Page Center */
        .page-wrapper {
            min-height: calc(100vh - 64px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Login Card */
        .login-card {
            background: var(--card-bg);
            width: 360px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #475569;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background: transparent;
            color: var(--text-primary);
        }

        input:focus {
            border-color: var(--button-bg);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
        }

        .errorlist {
            color: #dc2626;
            font-size: 13px;
            margin-top: 5px;
            padding-left: 0;
            list-style: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--button-bg);
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        button:hover {
            background: var(--button-hover);
        }

        .footer-text {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .footer-text a {
            color: var(--link);
            text-decoration: none;
            font-weight: 500;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<div class="navbar">
    <a href="/" class="logo">MyDjangoApp</a>
    <div class="nav-right">
        <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
        <a href="{% url 'signup' %}">Signup</a>
    </div>
</div>

<!-- Page Content -->
<div class="page-wrapper">
    <div class="login-card">
        <h2>Login</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}

            <p>
                {{ form.username.label_tag }}
                {{ form.username }}
                {{ form.username.errors }}
            </p>

            <p>
                {{ form.password.label_tag }}
                {{ form.password }}
                {{ form.password.errors }}
            </p>

            <button type="submit">Login</button>
        </form>

        <div class="footer-text">
            No account?
            <a href="{% url 'signup' %}">Create one</a>
        </div>
    </div>
</div>

<script>
    const root = document.documentElement;
    const savedTheme = localStorage.getItem("theme");

    if (savedTheme) {
        root.setAttribute("data-theme", savedTheme);
    }

    function toggleTheme() {
        const current = root.getAttribute("data-theme");
        const newTheme = current === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", newTheme);
        localStorage.setItem("theme", newTheme);
    }
</script>

</body>
</html>
