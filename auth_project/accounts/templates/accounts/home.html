<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        /* =========================
           THEME VARIABLES
        ========================== */
        :root {
            --bg: #f3f4f6;
            --navbar-bg: #1f2937;
            --card-bg: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #4b5563;
            --logout-bg: #ef4444;
            --logout-hover: #dc2626;
            --table-header: rgba(0, 0, 0, 0.05);
            --table-border: rgba(0, 0, 0, 0.1);
            --edit-bg: #2563eb;
            --edit-hover: #1d4ed8;
            --delete-bg: #ef4444;
            --delete-hover: #dc2626;
            --add-bg: #16a34a;
            --add-hover: #15803d;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --navbar-bg: #020617;
            --card-bg: #020617;
            --text-primary: #e5e7eb;
            --text-secondary: #94a3b8;
            --logout-bg: #dc2626;
            --logout-hover: #b91c1c;
            --table-header: rgba(255, 255, 255, 0.05);
            --table-border: rgba(255, 255, 255, 0.1);
            --edit-bg: #3b82f6;
            --edit-hover: #2563eb;
            --delete-bg: #f87171;
            --delete-hover: #ef4444;
            --add-bg: #22c55e;
            --add-hover: #16a34a;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
        }

        /* =========================
           NAVBAR
        ========================== */
        .navbar {
            background: var(--navbar-bg);
            padding: 14px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar .logo {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            text-decoration: none;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .username {
            color: #cbd5f5;
            font-weight: 500;
        }

        .logout-btn {
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            background: var(--logout-bg);
            border-radius: 6px;
            font-size: 14px;
        }

        .theme-toggle {
            background: transparent;
            border: 1px solid #64748b;
            color: #e5e7eb;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        /* =========================
           CONTENT
        ========================== */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        /* =========================
           HEADER WITH ADD BUTTON
        ========================== */
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .add-btn {
            background: var(--add-bg);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .add-btn:hover {
            background: var(--add-hover);
        }

        /* =========================
           EMPLOYEE TABLE
        ========================== */
        .employee-table {
            width: 100%;
            border-collapse: collapse;
        }

        .employee-table th,
        .employee-table td {
            padding: 12px;
            text-align: left;
        }

        .employee-table th {
            background: var(--table-header);
        }

        .employee-table tr {
            border-bottom: 1px solid var(--table-border);
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
        }

        .btn-edit {
            background: var(--edit-bg);
        }

        .btn-delete {
            background: var(--delete-bg);
        }

        .empty-row {
            text-align: center;
            font-style: italic;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <a href="{% url 'home' %}" class="logo">MyDjangoApp</a>
    <div class="nav-right">
        <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
        <span class="username">{{ request.user.username }}</span>
        <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
    </div>
</div>

<!-- CONTENT -->
<div class="container">

    <!-- Employee Table -->
    <div class="card">
        <div class="table-header">
            <h2>Employee Details</h2>
            <a href="{% url 'employee_create' %}" class="add-btn">+ Add New Employee</a>
        </div>

        <table class="employee-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Date Joined</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for emp in employees %}
                <tr>
                    <td>{{ emp.name }}</td>
                    <td>{{ emp.department }}</td>
                    <td>{{ emp.date_joined }}</td>
                    <td>
                        <div class="actions">
                            <a href="{% url 'employee_update' emp.id %}" class="btn btn-edit">Edit</a>
                            <a href="{% url 'employee_delete' emp.id %}" class="btn btn-delete"
                               onclick="return confirm('Are you sure you want to delete this employee?');">
                                Delete
                            </a>
                        </div>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="empty-row">No employees found</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</div>

<script>
    const root = document.documentElement;
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) root.setAttribute("data-theme", savedTheme);

    function toggleTheme() {
        const current = root.getAttribute("data-theme");
        const next = current === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
    }
</script>

</body>
</html>
