<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Confirm Delete</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        /* =========================
           THEME VARIABLES
        ========================== */
        :root {
            --bg: #f3f4f6;
            --navbar-bg: #1f2937;
            --card-bg: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #4b5563;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --border: #d1d5db;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --navbar-bg: #020617;
            --card-bg: #020617;
            --text-primary: #e5e7eb;
            --text-secondary: #94a3b8;
            --danger: #f87171;
            --danger-hover: #ef4444;
            --border: #475569;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
        }

        /* =========================
           NAVBAR
        ========================== */
        .navbar {
            background: var(--navbar-bg);
            padding: 14px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar .logo {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            text-decoration: none;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .theme-toggle {
            background: transparent;
            border: 1px solid #64748b;
            color: #e5e7eb;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .nav-btn {
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            background: #64748b;
            border-radius: 6px;
            font-size: 14px;
        }

        /* =========================
           CONTENT
        ========================== */
        .container {
            max-width: 500px;
            margin: 80px auto;
            padding: 0 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            text-align: center;
        }

        .card h2 {
            margin-top: 0;
        }

        .card p {
            color: var(--text-secondary);
            font-size: 15px;
            margin: 20px 0;
        }

        /* =========================
           ACTION BUTTONS
        ========================== */
        .actions {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 25px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-danger {
            background: var(--danger);
            color: #ffffff;
            border: none;
        }

        .btn-danger:hover {
            background: var(--danger-hover);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <a href="{% url 'home' %}" class="logo">MyDjangoApp</a>
    <div class="nav-right">
        <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
        <a href="{% url 'home' %}" class="nav-btn">Back</a>
    </div>
</div>

<!-- CONTENT -->
<div class="container">
    <div class="card">
        <h2>Confirm Delete</h2>

        <p>
            Are you sure you want to delete
            <strong>{{ employee.name }}</strong>?
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="actions">
                <a href="{% url 'home' %}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-danger">
                    Yes, Delete
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    const root = document.documentElement;
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) root.setAttribute("data-theme", savedTheme);

    function toggleTheme() {
        const current = root.getAttribute("data-theme");
        const next = current === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
    }
</script>

</body>
</html>
